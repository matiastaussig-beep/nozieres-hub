# Nozieres Hub — producción. Todo se levanta con:  docker compose up -d
services:
  app:
    image: ghcr.io/${GITHUB_REPO:-usuario/nozieres-hub}:latest
    build: .
    restart: always
    env_file: .env
    environment:
      DATA_DIR: /data
      COOKIE_SECURE: "1"
    volumes:
      - hubdata:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:   # HTTPS automático (Let's Encrypt) y renovación solo
    image: caddy:2
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]

  litestream:   # copia continua de la base a la nube (R2/S3): se pierde como máximo ~1 segundo
    image: litestream/litestream:0.3
    restart: always
    command: replicate
    env_file: .env
    volumes:
      - hubdata:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    depends_on: [app]

  autoheal:   # reinicia solo el contenedor si deja de responder
    image: willfarrell/autoheal
    restart: always
    environment: { AUTOHEAL_CONTAINER_LABEL: all }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]

  watchtower:   # actualiza solo la app cuando se publica una versión nueva
    image: containrrr/watchtower
    restart: always
    command: --interval 300 --cleanup hub-app-1
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    environment:
      REPO_USER: ${GHCR_USER:-}
      REPO_PASS: ${GHCR_TOKEN:-}

volumes:
  hubdata:
  caddydata:
